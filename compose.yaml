name: dota-stats

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

x-app: &app
  image: ${DOTA_IMAGE:-dota-stats:local}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs:
    - /tmp:size=16m,mode=1777
  logging: *logging
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    env_file:
      - path: ${DOTA_CONFIG_DIR:-/etc/dota-stats}/db.env
        format: raw
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=30, -c, work_mem=4MB]
    mem_limit: 512m
    shm_size: 128m
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./migrations/001_initial.up.sql:/docker-entrypoint-initdb.d/001.sql:ro
      - ./migrations/002_initial.up.sql:/docker-entrypoint-initdb.d/002.sql:ro
      - ./migrations/003_initial.up.sql:/docker-entrypoint-initdb.d/003.sql:ro
      - ./migrations/004_match_metadata.up.sql:/docker-entrypoint-initdb.d/004.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  web:
    <<: *app
    env_file:
      - path: ${DOTA_CONFIG_DIR:-/etc/dota-stats}/web.env
        format: raw
    ports:
      - "127.0.0.1:${DOTA_HTTP_PORT:-8080}:8080"
    mem_limit: 256m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/api/health]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    environment:
      DOTA_PUBLIC_IP: ${DOTA_PUBLIC_IP:-157.228.187.252}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-domains:/etc/caddy/domains:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=16m,mode=1777
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, -T, "5", -O, /dev/null, http://127.0.0.1:2019/config/]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  import-worker:
    <<: *app
    entrypoint: [/usr/local/bin/import-worker]
    working_dir: /state
    stop_grace_period: 30s
    environment:
      GOMEMLIMIT: 384MiB
      GOMAXPROCS: "1"
    env_file:
      - path: ${DOTA_CONFIG_DIR:-/etc/dota-stats}/importer.env
        format: raw
    volumes:
      - steam_tokens:/state
    mem_limit: 512m

  importer:
    <<: *app
    profiles: [import]
    restart: "no"
    entrypoint: [/usr/local/bin/gc-check]
    working_dir: /state
    environment:
      GOMEMLIMIT: 384MiB
      GOMAXPROCS: "1"
    env_file:
      - path: ${DOTA_CONFIG_DIR:-/etc/dota-stats}/importer.env
        format: raw
    volumes:
      - steam_tokens:/state
    mem_limit: 512m

volumes:
  postgres_data:
  steam_tokens:
  caddy_data:
  caddy_config:
